services:
  - type: web
    name: faisal-chatbot-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: ANTHROPIC_API_KEY
        scope: build,runtime
        sync: false
      - key: CHROMA_DATA_DIR
        value: ./chroma_data
        scope: build,runtime
